<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LangTrack</title>
  <meta name="description" content="Personal language study: learn vocabulary from books with spaced repetition and track your daily routine.">
  <meta name="theme-color" content="#256abf">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23256abf%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22%3E한%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">LangTrack</a>
    <label class="lang-switch"><span class="sr-only">Language</span><select id="langSwitch" aria-label="Language"></select></label>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="dashboard">Today</a>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/quiz" data-nav="quiz">Quiz</a>
      <a href="#/stats" data-nav="stats">Progress</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </header>

  <main id="app" class="container" tabindex="-1"></main>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <!-- Books: each file registers itself on window.LT_BOOKS (generated by npm run build:data) -->
  <script src="data/books/korean-1000.js"></script>
  <script src="data/books/japanese-1000.js"></script>
  <script src="data/books/chinese-1000.js"></script>
  <script src="data/books/russian-1000.js"></script>
  <script src="data/books/spanish-1000.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
